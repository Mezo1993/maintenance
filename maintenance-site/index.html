<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

  return function IconComp({ size = 16, style, ...rest }) {
    return <span style={{ fontSize:size, lineHeight:1, display:"inline-block", ...style }} {...rest}>{emoji}</span>;
  };
}

const FN = "/.netlify/functions/data";

// أقسام فشل تحميلها من الخادم: يُمنع الحفظ فيها حتى لا تُمسح البيانات الموجودة بقائمة فارغة
const FAILED_KEYS = new Set();
const LOAD_ERRORS = {};
// بصمة آخر نسخة حمّلناها أو حفظناها لكل قسم: تمنع الكتابة فوق بيانات أحدث على الخادم
const LOADED_SIG = {};
function listSig(list){
  const s = JSON.stringify(list || []);
  let h = 0;
  for(let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
  return s.length + ":" + h;
}
async function fetchServerList(key){
  const r = await fetch(`${FN}?key=${encodeURIComponent(key)}&t=${Date.now()}`, { cache:"no-store" });
  if(!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  return Array.isArray(j.value) ? j.value : [];
}

async function loadImage(key){
  const l = await fetchServerList(key);
  return l && l[0] ? l[0] : null;
}

async function loadList(key){
  let lastErr = "";
  for(let attempt = 0; attempt < 3; attempt++){
    try{
      const list = await fetchServerList(key);
      FAILED_KEYS.delete(key);
      LOADED_SIG[key] = listSig(list);
      return list;
    }catch(e){ lastErr = e && e.message ? e.message : String(e); }
    await new Promise(res => setTimeout(res, 600 * (attempt + 1)));
  }
  FAILED_KEYS.add(key); LOAD_ERRORS[key] = lastErr;
  return [];
}
async function assertFresh(key){
  if(LOADED_SIG[key] === undefined) return;
  let current;
  try{ current = await fetchServerList(key); }
  catch(e){ throw new Error("تعذر التحقق من نسخة الخادم قبل الحفظ (" + (e && e.message ? e.message : e) + ") — الإنترنت ضعيف؟ لم يُحفظ شيء."); }
  if(listSig(current) !== LOADED_SIG[key]){
    throw new Error("بيانات هذا القسم على الخادم تغيّرت منذ فتحت الصفحة (من جهاز أو مستخدم آخر، أو أن صفحتك قديمة). لم يُحفظ شيء حتى لا تُمسح بيانات أحدث. أعد تحميل الصفحة ثم كرّر التعديل.");
  }
}

async function saveList(key, list, force){
  if(!force && FAILED_KEYS.has(key)){
    throw new Error("لم تُحمَّل بيانات هذا القسم من الخادم، لذا أُوقف الحفظ لحماية بياناتك. أعد تحميل الصفحة.");
  }
  if(!force) await assertFresh(key);
  const approx = JSON.stringify(list).length;
  if(approx > 5400000){
    throw new Error(`حجم هذا القسم (${(approx/1e6).toFixed(1)} مليون حرف) تجاوز الحد الآمن للخادم (5.4 مليون). افتح لوحة التحكم ← "نقل صور الفواتير" لتخفيف الحجم.`);
  }
  const r = await fetch(FN, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key, value: list }),
  });
  if(!r.ok){
    const t = await r.text();
    throw new Error(`فشل الحفظ (HTTP ${r.status}) ${t || ""}`);
  }
  // تحقق فعلي: قراءة القسم من الخادم بعد الحفظ والتأكد من العدد
  let got = null;
  try{
    const c = await fetch(`${FN}?key=${encodeURIComponent(key)}&t=${Date.now()}`, { cache:"no-store" });
    if(c.ok){ const j = await c.json(); got = Array.isArray(j.value) ? j.value.length : -1; }
  }catch{}
  if(got !== null && got !== list.length){
    throw new Error(`لم يتأكد الحفظ على الخادم (المحفوظ ${got} من ${list.length}). لا تغلق الصفحة وأبلغني.`);
  }
  FAILED_KEYS.delete(key);
  LOADED_SIG[key] = listSig(list);
  return list;
}

const ROLE_RANK = { "فني":0, "مسؤول صيانة":1, "مهندس صيانة":2, "مدير الصيانة":3, "أدمن":4 };
function rankOf(user){ return ROLE_RANK[user && user.role_name] ?? 0; }

const SECTION_LABELS = { equipment:"معدات", workorders:"أوامر عمل", pmplans:"صيانة وقائية", purchaserequests:"طلبات شراء", transfers:"نقل", spareparts:"قطع غيار", users:"مستخدمون", sites:"محطات", invoices:"فواتير", accessories:"ملحقات", readings:"قراءات حالة" };
const FAULT_CATEGORIES = [
  { code:"HYD", label:"هيدروليك" },
  { code:"MEC", label:"ميكانيكا" },
  { code:"ELE", label:"كهرباء" },
  { code:"PNT", label:"دهان" },
  { code:"BLK", label:"حدادة" },
  { code:"ENG", label:"مكينة أو جيربوكس" },
];
const FAULT_CATEGORY_MAP = Object.fromEntries(FAULT_CATEGORIES.map(f => [f.code, f.label]));
const FAULT_CATEGORY_OPTION_PAIRS = FAULT_CATEGORIES.map(f => ({ value:f.code, label:`${f.code} (${f.label})` }));
function renderFaultCategory(code){
  if(!code) return "—";
  const label = FAULT_CATEGORY_MAP[code];
  return label ? (<span>{code} <span style={{ color:"var(--muted)" }}>({label})</span></span>) : code;
}
function faultText(code){
  if(!code) return "";
  const label = FAULT_CATEGORY_MAP[code];
  return label ? `${code} (${label})` : code;
}

const PRIORITIES = ["عاجل","عالي","عادي","منخفض"];
const PR_STATUSES = ["مقدم","تم الموافقة","تم التسليم","مكتمل","ملغي"];
const PR_CLOSED = ["مكتمل","تم التسليم","ملغي"];
const EQUIPMENT_STATUSES = ["يعمل","متوقف","تحت الصيانة","مفتوح","سكراب"];

function todayStr(){
  const d = new Date(); const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function fmtDate(d){
  if(!d) return "—";
  const x = new Date(d);
  return isNaN(x.getTime()) ? "—" : x.toISOString().slice(0,10);
}
function dTxt(d){ const x = fmtDate(d); return x === "—" ? "" : x; }
const VAT_RATE = 0.15;
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function lineAmounts(qty, price){
  const q = Number(qty) || 0, p = Number(price) || 0;
  const sub = round2(q * p);
  const vat = round2(sub * VAT_RATE);
  return { sub, vat, total: round2(sub + vat) };
}
function money(n){ return Number(n || 0).toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 }); }
const STATUS_ICON = { "يعمل":"🟢", "متوقف":"🔴", "تحت الصيانة":"🟠", "مفتوح":"🟡", "سكراب":"⚫" };
function numOrNull(v){
  if(v === "" || v === null || v === undefined) return null;
  const n = Number(v);
  return isFinite(n) ? n : null;
}
// يحذف بادئة eq من رمز المعدة (للعرض خارج صفحة المعدات)
function stripEq(v){ return String(v ?? "").replace(/^\s*eq[-_\s]*/i, ""); }

function computeKPI(list){
  const total = list.length;
  const completed = list.filter(w => w.status === "مكتمل");
  const completionRate = total ? Math.round(completed.length/total*100) : 0;
  const durations = completed
    .filter(w => w.opened_at && w.closed_at)
    .map(w => (new Date(w.closed_at) - new Date(w.opened_at)) / 86400000)
    .filter(d => isFinite(d) && d >= 0);
  const avgDays = durations.length ? (durations.reduce((a,b)=>a+b,0)/durations.length).toFixed(1) : null;
  return { total, completedCount:completed.length, openCount: total - completed.length, completionRate, avgDays };
}

// ---- طلبات الشراء: مدة الطلب القصوى 3 أشهر ----
function prInfo(pr){
  const start = pr.request_date || (pr.last_modified_at ? String(pr.last_modified_at).slice(0,10) : null);
  if(!start) return null;
  const s = new Date(start);
  if(isNaN(s.getTime())) return null;
  const expiry = new Date(s.getTime());
  expiry.setMonth(expiry.getMonth() + 3);
  const daysLeft = Math.ceil((expiry.getTime() - Date.now()) / 86400000);
  return { start, expiry, daysLeft };
}
function prAlertLevel(pr){
  if(PR_CLOSED.includes(pr.status)) return null;
  const i = prInfo(pr);
  if(!i) return null;
  if(i.daysLeft < 0) return "expired";
  if(i.daysLeft <= 14) return "soon";
  return null;
}
function prExpiryText(pr){
  if(PR_CLOSED.includes(pr.status)) return "—";
  const i = prInfo(pr);
  if(!i) return "—";
  return i.daysLeft < 0 ? `منتهي منذ ${-i.daysLeft} يوم` : `${i.daysLeft} يوم`;
}

// ---- كتالوج القطع (مشتق من الطلبات والمشتريات) ----
function buildCatalog(spareparts, purchaserequests, invoiceMap){
  const map = {};
  const norm = s => String(s || "").trim().toLowerCase();
  const get = (name) => {
    const k = norm(name);
    if(!k) return null;
    if(!map[k]) map[k] = { key:k, part_name:String(name).trim(), part_no:"", brand:"", country:"", requests:[], purchases:[], equipment:new Set(), last_price:null, last_price_date:"" };
    return map[k];
  };
  purchaserequests.forEach(r => {
    const c = get(r.part_name); if(!c) return;
    c.requests.push(r);
    if(r.part_no) c.part_no = r.part_no;
    if(r.equipment_id) c.equipment.add(r.equipment_id);
  });
  spareparts.forEach(p => {
    const c = get(p.part_name); if(!c) return;
    c.purchases.push(p);
    if(p.part_no) c.part_no = p.part_no;
    if(p.brand) c.brand = p.brand;
    if(p.country) c.country = p.country;
    if(p.equipment_id) c.equipment.add(p.equipment_id);
    const inv = invoiceMap[p.invoice_id];
    const d = p.received_date || (inv && inv.date) || "";
    if(numOrNull(p.price) !== null && (c.last_price === null || d >= c.last_price_date)){ c.last_price = p.price; c.last_price_date = d; }
  });
  return Object.values(map).map(c => ({
    ...c,
    equipment: Array.from(c.equipment),
    request_count: c.requests.length,
    total_qty: c.purchases.reduce((s,p) => s + (Number(p.qty)||0), 0),
  })).sort((a,b) => a.part_name.localeCompare(b.part_name, "ar"));
}

// ---- الصيانة التنبؤية ----
const READING_PARAMS = ["ساعات التشغيل","عداد المسافة (كم)","درجة حرارة المحرك (°C)","ضغط زيت المحرك (bar)","الاهتزاز (mm/s)","ضغط النظام الهيدروليكي (bar)","درجة حرارة الزيت الهيدروليكي (°C)","تيار المحرك (A)","جزيئات الزيت (ppm)","سُمك البطانات (mm)"];
const DIR_PAIRS = [{ value:"high", label:"ارتفاع القيمة = خطر" }, { value:"low", label:"انخفاض القيمة = خطر" }];
const LEVEL_LABEL = { high:"مرتفع", mid:"متوسط", low:"منخفض" };

function analyzeSeries(rs){
  const pts = rs
    .map(r => ({ t:new Date(r.date).getTime()/86400000, v:numOrNull(r.value), r }))
    .filter(p => isFinite(p.t) && p.v !== null)
    .sort((a,b) => a.t - b.t);
  if(!pts.length) return null;
  const last = pts[pts.length-1];
  const warn = numOrNull(last.r.warn_limit), crit = numOrNull(last.r.crit_limit);
  const low = last.r.direction === "low";
  const beyond = (v, lim) => lim === null ? false : (low ? v <= lim : v >= lim);
  const level = beyond(last.v, crit) ? 2 : beyond(last.v, warn) ? 1 : 0;
  let slope = null;
  const recent = pts.slice(-10);
  if(recent.length >= 3){
    const x0 = recent[0].t, n = recent.length;
    const xs = recent.map(p => p.t - x0), ys = recent.map(p => p.v);
    const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
    const den = xs.reduce((s,x)=> s + (x-mx)*(x-mx), 0);
    if(den > 0) slope = xs.reduce((s,x,i)=> s + (x-mx)*(ys[i]-my), 0) / den;
  }
  const limitUsed = crit !== null ? crit : warn;
  let predicted = null, daysFromNow = null;
  if(slope !== null && slope !== 0 && limitUsed !== null && !beyond(last.v, limitUsed)){
    const towards = low ? slope < 0 : slope > 0;
    if(towards){
      const d = (limitUsed - last.v) / slope;
      if(d >= 0 && isFinite(d)){
        predicted = new Date((last.t + d) * 86400000);
        daysFromNow = Math.max(0, (predicted.getTime() - Date.now()) / 86400000);
      }
    }
  }
  return { n:pts.length, last:last.v, lastDate:last.r.date, warn, crit, low, level, slope, limitUsed, predicted, daysFromNow };
}

function buildSeriesList(list){
  const seriesMap = {};
  list.forEach(r => {
    if(!r.equipment_id || !r.parameter) return;
    const k = r.equipment_id + "||" + r.parameter;
    (seriesMap[k] = seriesMap[k] || []).push(r);
  });
  return Object.entries(seriesMap).map(([k,rs]) => {
    const a = analyzeSeries(rs);
    if(!a) return null;
    const idx = k.indexOf("||");
    return { eid:k.slice(0,idx), param:k.slice(idx+2), ...a };
  }).filter(Boolean);
}

function failureStats(eqId, wos){
  const now = Date.now();
  const fails = wos
    .filter(w => w.equipment_id === eqId && w.opened_at && !/وقائ/.test(String(w.type || "")))
    .map(w => ({ ...w, _t:new Date(w.opened_at).getTime() }))
    .filter(w => isFinite(w._t))
    .sort((a,b) => a._t - b._t);
  const f90 = fails.filter(w => (now - w._t)/86400000 <= 90).length;
  let mtbf = null;
  if(fails.length >= 2){
    const gaps = [];
    for(let i=1;i<fails.length;i++) gaps.push((fails[i]._t - fails[i-1]._t)/86400000);
    mtbf = gaps.reduce((a,b)=>a+b,0)/gaps.length;
  }
  const last = fails.length ? fails[fails.length-1] : null;
  const sinceLast = last ? (now - last._t)/86400000 : null;
  const nextExpected = (mtbf !== null && last) ? new Date(last._t + mtbf*86400000) : null;
  const closed = fails.filter(w => w.closed_at && isFinite(new Date(w.closed_at).getTime()));
  const mttr = closed.length ? closed.reduce((s,w) => s + (new Date(w.closed_at).getTime() - w._t)/3600000, 0)/closed.length : null;
  const cats = {};
  fails.forEach(w => { if(w.fault_category) cats[w.fault_category] = (cats[w.fault_category]||0) + 1; });
  const topCat = Object.entries(cats).sort((a,b) => b[1]-a[1])[0] || null;
  return { count:fails.length, f90, mtbf, sinceLast, lastDate: last ? last._t : null, nextExpected, mttr, topCat };
}

function riskScore(fs, ser, eq){
  let score = 0; const reasons = []; const recs = [];
  if(fs.f90 > 0){ score += Math.min(40, fs.f90*10); reasons.push(`${fs.f90} عطل خلال 90 يومًا`); }
  if(fs.mtbf && fs.sinceLast !== null){
    const ratio = fs.sinceLast / fs.mtbf;
    if(ratio >= 1){ score += 30; reasons.push("تجاوز متوسط الفترة بين الأعطال"); recs.push("جدولة صيانة وقائية عاجلة وتجهيز قطع الغيار الحرجة"); }
    else if(ratio >= 0.8){ score += 20; reasons.push("اقترب من موعد العطل المتوقع"); recs.push("جدولة فحص وقائي خلال أسبوع"); }
  }
  const worst = ser.reduce((m,s) => Math.max(m, s.level), 0);
  if(worst === 2){ score += 30; reasons.push("قراءة حالة في المنطقة الحرجة"); recs.unshift("فحص فوري وإصدار أمر عمل تصحيحي"); }
  else if(worst === 1){ score += 15; reasons.push("قراءة تجاوزت حد التحذير"); recs.push("زيادة وتيرة المراقبة"); }
  const soon = ser.filter(s => s.daysFromNow !== null && s.daysFromNow <= 30);
  if(soon.length){
    score += 15;
    const m = Math.min(...soon.map(s => s.daysFromNow));
    reasons.push(`الاتجاه يشير لبلوغ الحد خلال ${Math.round(m)} يومًا`);
    recs.push("التدخل قبل بلوغ الحد المتوقع");
  }
  const year = Number(eq.purchaseYear);
  if(year > 1950){
    const age = new Date().getFullYear() - year;
    if(age >= 10){ score += 10; reasons.push(`عمر المعدة ${age} سنة`); }
    else if(age >= 5){ score += 5; }
  }
  if(fs.topCat && fs.topCat[1] >= 3) recs.push(`تحليل السبب الجذري للعطل المتكرر (${fs.topCat[0]})`);
  score = Math.min(100, score);
  const level = score >= 60 ? "high" : score >= 30 ? "mid" : "low";
  if(!recs.length) recs.push(score >= 30 ? "متابعة وزيادة وتيرة الفحص" : "الاستمرار على الجدول الوقائي الحالي");
  return { score, level, reasons, recs, worst };
}

function uid(prefix){ return prefix + "-" + Math.random().toString(36).slice(2,9).toUpperCase(); }

function distinctValues(list, key){
  const s = new Set();
  list.forEach(it => { if(it[key]) s.add(it[key]); });
  return Array.from(s);
}

function escHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function cellText(c, row){
  const v = c.text ? c.text(row) : row[c.key];
  return v === undefined || v === null ? "" : v;
}

function toCSV(columns, rows){
  const header = columns.map(c => '"' + String(c.label).replace(/"/g,'""') + '"').join(",");
  const lines = rows.map(row =>
    columns.map(c => '"' + String(cellText(c,row)).replace(/"/g,'""') + '"').join(",")
  );
  return "﻿" + [header, ...lines].join("\r\n");
}

function downloadCSV(filename, csvContent){
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function printTable(title, columns, rows){
  const win = window.open("", "_blank");
  if(!win) return;
  const headRow = columns.map(c => `<th>${escHtml(c.label)}</th>`).join("");
  const bodyRows = rows.map(row =>
    `<tr>${columns.map(c => `<td>${escHtml(cellText(c,row))}</td>`).join("")}</tr>`
  ).join("");
  win.document.write(`
    <!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
    <title>${escHtml(title)}</title>
    <style>
      body{ font-family:Tahoma,Arial,sans-serif; padding:20px; direction:rtl; }
      h2{ margin-bottom:4px; }
      .meta{ color:#666; font-size:12px; margin-bottom:16px; }
      table{ width:100%; border-collapse:collapse; font-size:12px; }
      th,td{ border:1px solid #999; padding:6px 8px; text-align:right; }
      th{ background:#eee; }
    </style></head><body>
    <h2>${escHtml(title)}</h2>
    <div class="meta">تاريخ الطباعة: ${new Date().toLocaleString("en-US")} — عدد السجلات: ${rows.length}</div>
    <table><thead><tr>${headRow}</tr></thead><tbody>${bodyRows}</tbody></table>
    <script>window.onload = function(){ window.print(); }<\/script>
    </body></html>
  `);
  win.document.close();
}

function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1000; quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---- دمج معدات من ملف: يضيف الناقص فقط ولا يغيّر أي قيمة موجودة (يملأ الفراغ ويصلح الحروف التالفة فقط) ----
function MergeEquipmentPanel({ equipment, sites, setEquipment, setSites, onLog }){
  const [open,setOpen] = useState(false);
  const [plan,setPlan] = useState(null);
  const [status,setStatus] = useState("");
  const [busy,setBusy] = useState(false);
  const nk = (v) => stripEq(String(v ?? "")).replace(/^022-/,"").trim().toUpperCase();
  const bad = (v) => typeof v === "string" && v.indexOf("�") !== -1;
  const empty = (v) => v === undefined || v === null || v === "";

  const buildPlan = (data) => {
    const siteList = sites.map(x => ({ ...x }));
    const siteName = (x) => String(x.site_name || x.name || "").trim();
    const siteIdFor = {};
    const newSites = [];
    for(const sp of (data.sites || [])){
      const names = [sp.site_name, ...(sp.aliases || [])].map(x => String(x).trim().toLowerCase());
      let found = sp.site_id ? siteList.find(x => String(x.site_id) === String(sp.site_id)) : null;
      if(!found) found = siteList.find(x => names.includes(siteName(x).toLowerCase()));
      if(found){ siteIdFor[sp.site_name] = found.site_id; }
      else {
        const rec = { site_id: sp.site_id || uid("site"), site_name: sp.site_name };
        siteList.push(rec); newSites.push(rec); siteIdFor[sp.site_name] = rec.site_id;
      }
    }
    const byName = {};
    equipment.forEach((e,i) => { byName[nk(e.name || e.equipment_id)] = i; });
    const next = equipment.map(e => ({ ...e }));
    const added = []; let filled = 0, fixed = 0, touched = 0;
    const stamp = { last_modified_by: "استيراد الأصول", last_modified_at: new Date().toISOString() };
    for(const r of (data.equipment || [])){
      const key = nk(r.name);
      if(!key) continue;
      const idx = byName[key];
      if(idx === undefined){
        const rec = { ...r, site_id: siteIdFor[r.site_name] || "", ...stamp };
        delete rec.site_name;
        next.push(rec); byName[key] = next.length - 1; added.push(rec);
      } else {
        const cur = next[idx]; let changed = false;
        for(const f of ["desc","type","model","plate","purchaseYear","purchaseValue","asset_no","barcode"]){
          if(empty(cur[f]) && !empty(r[f])){ cur[f] = r[f]; filled++; changed = true; }
          else if(bad(cur[f]) && !empty(r[f])){ cur[f] = r[f]; fixed++; changed = true; }
        }
        // حذف البادئة 022- من الرمز المعروض (المعرّف الداخلي equipment_id لا يتغير حتى لا تنكسر الروابط)
        for(const f of ["name","barcode"]){
          if(typeof cur[f] === "string" && /^\s*022-/.test(cur[f])){ cur[f] = cur[f].replace(/^\s*022-/,""); fixed++; changed = true; }
        }
        if(bad(cur.status)){ cur.status = "يعمل"; fixed++; changed = true; }
        if(bad(cur.condition)){ cur.condition = "غير محدد"; fixed++; changed = true; }
        if(bad(cur.last_modified_by)){ cur.last_modified_by = "حمزة السفياني"; fixed++; changed = true; }
        if(changed) touched++;
      }
    }
    const perSite = {};
    added.forEach(a => { const n = (siteList.find(x => String(x.site_id) === String(a.site_id)) || {}).site_name || "؟"; perSite[n] = (perSite[n] || 0) + 1; });
    return { next, siteList, newSites, added, filled, fixed, touched, perSite, total: next.length };
  };

  const onFile = async (e) => {
    setStatus(""); setPlan(null);
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      if(!Array.isArray(data.equipment)) throw new Error("الملف لا يحتوي قائمة معدات");
      setPlan(buildPlan(data));
    }catch(err){ setStatus("تعذر قراءة الملف: " + (err && err.message ? err.message : err)); }
  };

  const apply = async () => {
    if(!plan) return;
    setBusy(true); setStatus("");
    try{
      if(plan.newSites.length){ await saveList("sites", plan.siteList); setSites(plan.siteList); }
      await saveList("equipment", plan.next); setEquipment(plan.next);
      onLog("دمج معدات", "equipment", `+${plan.added.length}`);
      setStatus(`تم الدمج ✓ أُضيفت ${plan.added.length} معدة وأصبح الإجمالي ${plan.total}.`);
      setPlan(null);
    }catch(err){ setStatus("لم يتم الدمج: " + (err && err.message ? err.message : err)); }
    setBusy(false);
  };

  if(!open) return (
    <div style={{ marginBottom:10 }}>
      <button type="button" className="icon-btn" onClick={()=>setOpen(true)}>📥 دمج معدات من ملف (إضافة الناقص فقط)</button>
    </div>
  );
  return (
    <div className="card" style={{ marginBottom:10 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <h3 style={{ margin:0 }}>📥 دمج المعدات من الملف</h3>
        <button className="icon-btn" onClick={()=>{ setOpen(false); setPlan(null); }}><IconX size={14}/></button>
      </div>
      <p style={{ fontSize:13, color:"var(--muted)" }}>اختر ملف الدمج (equipment-merge.json). يعرض النظام ملخصًا أولًا ولا يحفظ شيئًا حتى تضغط "تنفيذ الدمج". المعدات الموجودة لا تتغير قيمها، ويُملأ فقط الفارغ ويُصلح التالف.</p>
      <input type="file" accept=".json,application/json" onChange={onFile} />
      {plan && (
        <div style={{ marginTop:10 }}>
          <div><span className="stat"><b>{plan.added.length}</b>معدة جديدة</span>
            <span className="stat"><b>{plan.touched}</b>معدة موجودة سيُكمَّل نقصها ({plan.filled} حقل فارغ، {plan.fixed} تالف)</span>
            <span className="stat"><b>{plan.newSites.length}</b>محطة جديدة</span>
            <span className="stat"><b>{plan.total}</b>الإجمالي بعد الدمج</span></div>
          {plan.newSites.length > 0 && <p style={{ fontSize:13 }}>محطات ستُضاف: {plan.newSites.map(x => x.site_name).join("، ")}</p>}
          <p style={{ fontSize:13 }}>توزيع الجديد: {Object.entries(plan.perSite).map(([k,v]) => `${k} (${v})`).join("، ")}</p>
          <button type="button" className="btn" style={{ width:"auto", padding:"10px 16px" }} disabled={busy} onClick={apply}>{busy ? "جارٍ الحفظ..." : "تنفيذ الدمج"}</button>
        </div>
      )}
      {status && <p className={status.startsWith("تم") ? "ok-msg" : "error"}>{status}</p>}
    </div>
  );
}

                <div className="field" style={{ margin:0, minWidth:130 }}>
                  <label>من تاريخ</label>
                  <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} />
                </div>
                <div className="field" style={{ margin:0, minWidth:130 }}>
                  <label>إلى تاريخ</label>
                  <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} />
                </div>
              </React.Fragment>
            )}
            {resolveSite && (
              <div className="field" style={{ margin:0, minWidth:150 }}>
                <label>المحطة</label>
                <select value={siteFilter} onChange={e=>setSiteFilter(e.target.value)}>
                  <option value="">كل المحطات</option>
                  {sitePairs.map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
                </select>
              </div>
            )}
            <button className="btn-secondary" onClick={doExport}>تصدير Excel (كل البيانات)</button>
            <button className="btn-secondary" onClick={doPrint}>🖨️ طباعة</button>
          </div>
        </div>
      )}
      <div style={{ overflowX:"auto" }}>
        <table>
          <thead><tr>
            {columns.map(c => <th key={c.key}>{c.label}</th>)}
            {showActions && <th>إجراءات</th>}
          </tr></thead>
          <tbody>
            {filtered.map(item => (
              <tr key={item[idField]}>
                {columns.map(c => <td key={c.key}>{c.render ? c.render(item) : String(item[c.key] ?? "")}</td>)}
                {showActions && (
                  <td>
                    <div className="row-actions">
                      {extraActions && extraActions(item)}
                      {canEdit && <button className="icon-btn" onClick={()=>onEdit(item)}>تعديل</button>}
                      {canEdit && <button className="btn-danger" onClick={()=>setConfirmId(item[idField])}>حذف</button>}
                    </div>
                  </td>
                )}
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan={columns.length + (showActions ? 1 : 0)} style={{ textAlign:"center", color:"var(--muted)" }}>لا توجد بيانات</td></tr>}
          </tbody>
        </table>
      </div>
      {confirmId && (
        <ConfirmInline text="هل أنت متأكد من الحذف؟" onYes={()=>{ onDelete(confirmId); setConfirmId(null); }} onNo={()=>setConfirmId(null)} />
      )}
    </div>
  );
}

// حقل بحث + قائمة منسدلة: اكتب حرفًا لتصفية القائمة ثم اختر منها
function SearchSelect({ value, options, onChange, fallbackLabel }){
  const [q,setQ] = useState("");
  const qq = q.trim().toLowerCase();
  const filtered = qq
    ? options.filter(o => String(o.label).toLowerCase().includes(qq) || String(o.value).toLowerCase().includes(qq))
    : options;
  const known = options.some(o => String(o.value) === String(value));
  return (
    <div>
      <input placeholder="اكتب للبحث..." value={q} onChange={e=>setQ(e.target.value)} />
      <select value={value || ""} onChange={e=>onChange(e.target.value)}
        size={qq ? Math.min(6, Math.max(2, filtered.length + 1)) : 1} style={{ marginTop:6 }}>
        <option value="">— اختر —</option>
        {value && !known && <option value={value}>{fallbackLabel ? fallbackLabel(value) : value}</option>}
        {filtered.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
      {qq && filtered.length === 0 && <div className="hint">لا توجد نتائج مطابقة</div>}
    </div>
  );
}

function SectionTable({ title, storageKey, idField, idPrefix, data, setData, canEdit, fieldsDef, columns, defaultsOnAdd, currentUser, onLog, canExport, dateField, resolveSite, sitePairs, onBeforeSave, onAfterSave, viewFilter, extraActions, prefill, onPrefillUsed, validate, addLabel, exportColumns }){
  const [modal,setModal] = useState(null);
  const [err,setErr] = useState("");

  useEffect(() => {
    if(prefill){ setErr(""); setModal(prefill); if(onPrefillUsed) onPrefillUsed(); }
  }, [prefill]);

  // العرض يُفلتر حسب المحطة، أما الحفظ فيتم دائمًا على القائمة الكاملة
  const items = viewFilter ? data.filter(viewFilter) : data;

  const getDefaults = () => typeof defaultsOnAdd === "function" ? defaultsOnAdd() : (defaultsOnAdd || {});

  const save = async () => {
    setErr("");
    if(validate){ const m = validate(modal); if(m){ setErr(m); return; } }
    try{
      let record = { ...modal };
      const isNew = !record[idField];
      if(isNew){ record = { ...getDefaults(), ...record, [idField]: uid(idPrefix) }; }
      if(typeof onBeforeSave === "function"){ record = onBeforeSave(record, isNew) || record; }
      record.last_modified_by = currentUser.full_name;
      record.last_modified_at = new Date().toISOString();

      const next = isNew ? [...data, record] : data.map(d => d[idField] === record[idField] ? record : d);
      await saveList(storageKey, next);
      setData(next);
      if(onLog) onLog(isNew ? "إضافة" : "تعديل", storageKey, record[idField]);
      if(onAfterSave) await onAfterSave(record, isNew);
      setModal(null);
    }catch(e){
      setErr("تعذر الحفظ: " + (e && e.message ? e.message : String(e)));
    }
  };
  const del = async (id) => {
    try{
      const next = data.filter(d => d[idField] !== id);
      await saveList(storageKey, next);
      setData(next);
      if(onLog) onLog("حذف", storageKey, id);
    }catch(e){
      alert("تعذر الحذف: " + (e && e.message ? e.message : String(e)));
    }
  };

  return (
    <div>
      <GenericTable title={title} items={items} columns={columns} canEdit={canEdit} idField={idField}
        canExport={canExport} dateField={dateField} resolveSite={resolveSite} sitePairs={sitePairs}
        addLabel={addLabel} extraActions={extraActions} exportColumns={exportColumns}
        onAdd={()=>{ setErr(""); setModal({ ...Object.fromEntries(fieldsDef.map(f=>[f.key,""])), ...getDefaults() }); }}
        onEdit={(item)=>{ setErr(""); setModal(item); }} onDelete={del} />
      {modal && (
        <EditModal title={modal[idField] ? "تعديل" : "إضافة"} fields={fieldsDef} error={err}
          values={modal} onChange={(k,v)=>setModal({...modal,[k]:v})} onSave={save} onClose={()=>{ setModal(null); setErr(""); }} />
      )}
    </div>
  );
}

// ---- نافذة فاتورة واحدة بعدة قطع ----
function InvoiceModal({ onClose, onSave, equipmentOptionPairs, eqText, partNames, brands, countries, sitePairs, showSite, defaultSite }){
  const blankLine = (eq) => ({ part_name:"", part_no:"", qty:"", price:"", brand:"", country:"", equipment_id:eq || "" });
  const [inv,setInv] = useState({ invoice_no:"", supplier:"", date:todayStr(), image:"", site_id:defaultSite || "", equipment_id:"" });
  const [lines,setLines] = useState([blankLine("")]);
  const [err,setErr] = useState("");
  const [busy,setBusy] = useState(false);

  const setLine = (i,k,v) => setLines(lines.map((l,idx) => idx === i ? { ...l, [k]:v } : l));
  const setDefaultEq = (v) => {
    setInv({ ...inv, equipment_id:v });
    setLines(lines.map(l => l.equipment_id ? l : { ...l, equipment_id:v }));
  };
  const totals = lines.reduce((t,l) => {
    const a = lineAmounts(l.qty, l.price);
    return { sub:t.sub + a.sub, vat:t.vat + a.vat, total:t.total + a.total };
  }, { sub:0, vat:0, total:0 });
  const validEq = (id) => equipmentOptionPairs.some(o => String(o.value) === String(id));

  const submit = async () => {
    setErr("");
    if(!inv.invoice_no.trim()){ setErr("أدخل رقم الفاتورة"); return; }
    for(let i=0;i<lines.length;i++){
      const l = lines[i];
      const touched = String(l.part_name).trim() || String(l.qty).trim() || String(l.price).trim();
      if(touched && (!String(l.part_name).trim() || !(Number(l.qty) > 0))){
        setErr(`القطعة رقم ${i+1}: الاسم والعدد (أكبر من صفر) مطلوبان`); return;
      }
      if(touched && !validEq(l.equipment_id)){
        setErr(`القطعة رقم ${i+1}: اختر المعدة من القائمة (إجباري)`); return;
      }
    }
    const valid = lines.filter(l => String(l.part_name).trim());
    if(!valid.length){ setErr("أضف قطعة واحدة على الأقل"); return; }
    setBusy(true);
    try{
      await onSave(inv, valid);
      onClose();
    }catch(e){
      setErr("تعذر الحفظ: " + (e && e.message ? e.message : String(e)));
      setBusy(false);
    }
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal wide" onClick={e=>e.stopPropagation()}>
        <div className="topbar"><h3>🧾 فاتورة بعدة قطع</h3><button className="icon-btn" onClick={onClose}><IconX size={14}/></button></div>

        <div className="grid2">
          <div className="field"><label>رقم الفاتورة</label>
            <input value={inv.invoice_no} onChange={e=>setInv({ ...inv, invoice_no:e.target.value })} /></div>
          <div className="field"><label>المورّد</label>
            <input value={inv.supplier} onChange={e=>setInv({ ...inv, supplier:e.target.value })} /></div>
          <div className="field"><label>تاريخ الفاتورة / الاستلام</label>
            <input type="date" value={inv.date} onChange={e=>setInv({ ...inv, date:e.target.value })} /></div>
          {showSite && (
            <div className="field"><label>المحطة</label>
              <select value={inv.site_id} onChange={e=>setInv({ ...inv, site_id:e.target.value })}>
                <option value="">اختر</option>
                {sitePairs.map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
              </select></div>
          )}
        </div>
        <div className="field"><label>معدة افتراضية للفاتورة (اختياري — تُطبَّق على كل القطع ويمكن تغييرها لكل قطعة)</label>
          <SearchSelect value={inv.equipment_id} options={equipmentOptionPairs} fallbackLabel={eqText} onChange={setDefaultEq} /></div>
        <div className="field"><label>صورة الفاتورة (مرة واحدة للفاتورة كلها)</label>
          {inv.image && <img src={inv.image} className="thumb" style={{ marginBottom:6, width:80, height:80 }} />}
          <input type="file" accept="image/*" onChange={async e=>{
            const file = e.target.files[0]; if(!file) return;
            const dataUrl = await compressImage(file, 900, 0.5);
            setInv({ ...inv, image:dataUrl });
          }} />
        </div>

        <datalist id="inv-parts">{partNames.map(n => <option key={n} value={n} />)}</datalist>
        <datalist id="inv-brands">{brands.map(n => <option key={n} value={n} />)}</datalist>
        <datalist id="inv-countries">{countries.map(n => <option key={n} value={n} />)}</datalist>

        <h4 style={{ margin:"6px 0 8px" }}>قطع الفاتورة ({lines.length})</h4>
        {lines.map((l,i) => {
          const a = lineAmounts(l.qty, l.price);
          return (
            <div className="line-box" key={i}>
              <div className="topbar" style={{ marginBottom:6 }}>
                <b style={{ fontSize:13 }}>قطعة {i+1}</b>
                {lines.length > 1 && <button className="icon-btn" onClick={()=>setLines(lines.filter((_,idx)=>idx!==i))}>حذف السطر</button>}
              </div>
              <div className="grid2">
                <div className="field"><label>اسم القطعة</label>
                  <input list="inv-parts" value={l.part_name} onChange={e=>setLine(i,"part_name",e.target.value)} /></div>
                <div className="field"><label>رقم القطعة</label>
                  <input value={l.part_no} onChange={e=>setLine(i,"part_no",e.target.value)} /></div>
                <div className="field"><label>العدد</label>
                  <input type="number" min="0" value={l.qty} onChange={e=>setLine(i,"qty",e.target.value)} /></div>
                <div className="field"><label>سعر الوحدة (قبل الضريبة)</label>
                  <input type="number" min="0" value={l.price} onChange={e=>setLine(i,"price",e.target.value)} /></div>
                <div className="field"><label>الماركة</label>
                  <input list="inv-brands" value={l.brand} onChange={e=>setLine(i,"brand",e.target.value)} /></div>
                <div className="field"><label>بلد الصنع</label>
                  <input list="inv-countries" value={l.country} onChange={e=>setLine(i,"country",e.target.value)} /></div>
              </div>
              {a.sub > 0 && (
                <div className="info" style={{ marginBottom:10 }}>
                  المجموع: <b>{money(a.sub)}</b> — الضريبة {VAT_RATE*100}%: <b>{money(a.vat)}</b> — الإجمالي شامل الضريبة: <b>{money(a.total)}</b>
                </div>
              )}
              <div className="field" style={{ marginBottom:0 }}><label>المعدة (إجباري — من القائمة)</label>
                <SearchSelect value={l.equipment_id} options={equipmentOptionPairs} fallbackLabel={eqText}
                  onChange={v=>setLine(i,"equipment_id",v)} /></div>
            </div>
          );
        })}
        <button type="button" className="btn-secondary" style={{ marginBottom:12 }} onClick={()=>setLines([...lines, blankLine(inv.equipment_id)])}>
          <IconPlus size={13}/> إضافة قطعة أخرى لنفس الفاتورة
        </button>
        <div className="grid3">
          <div className="info"><span>المجموع قبل الضريبة</span>{money(totals.sub)}</div>
          <div className="info"><span>ضريبة القيمة المضافة {VAT_RATE*100}%</span>{money(totals.vat)}</div>
          <div className="info"><span>الإجمالي شامل الضريبة</span><b>{money(totals.total)}</b></div>
        </div>
        {err && <p className="error">{err}</p>}
        <button type="button" className="btn" onClick={submit} disabled={busy}>{busy ? "جارٍ الحفظ..." : "حفظ الفاتورة وكل القطع"}</button>
      </div>
    </div>
  );
}

// ---- نبذة مختصرة عن المعدة (تظهر عند الضغط على رمزها) ----
function EquipmentSummaryModal({ item, workorders, pmplans, spareparts, accessories, transfers, readings, siteName, onClose }){
  const id = item.equipment_id;
  const wos = workorders.filter(w => w.equipment_id === id);
  const openCount = wos.filter(w => w.status !== "مكتمل").length;
  const lastWo = wos.filter(w => w.opened_at).sort((a,b) => String(b.opened_at).localeCompare(String(a.opened_at)))[0];
  const parts = spareparts.filter(p => p.equipment_id === id);
  const partsQty = parts.reduce((s,p) => s + (Number(p.qty)||0), 0);
  const accs = accessories.filter(a => a.equipment_id === id);
  const pmCount = pmplans.filter(p => p.equipment_id === id).length;
  const lastTr = transfers.filter(t => t.equipment_id === id)
    .sort((a,b) => String(b.transfer_date || "").localeCompare(String(a.transfer_date || "")))[0];
  const fs = failureStats(id, workorders);
  const ser = buildSeriesList(readings.filter(r => r.equipment_id === id));
  const risk = riskScore(fs, ser, item);
  const hasData = fs.count > 0 || ser.length > 0;
  const year = Number(item.purchaseYear);
  const age = year > 1950 ? new Date().getFullYear() - year : null;
  const icon = STATUS_ICON[item.status] || "⚪";

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal wide" onClick={e=>e.stopPropagation()}>
        <div className="topbar">
          <h3 style={{ margin:0 }}>{icon} {item.name || id}</h3>
          <button className="icon-btn" onClick={onClose}><IconX size={14}/></button>
        </div>
        <p style={{ color:"var(--muted)", fontSize:13, marginTop:0 }}>{item.desc || "—"}</p>

        <div className="grid3">
          <div className="info"><span>الحالة التشغيلية</span>{icon} {item.status || "—"}</div>
          <div className="info"><span>🛠️ الحالة الفنية</span>{item.condition || "—"}</div>
          <div className="info"><span>المحطة</span>{siteName(item.site_id)}</div>
          <div className="info"><span>النوع</span>{item.type || "—"}</div>
          <div className="info"><span>الموديل / اللوحة</span>{item.model || "—"} / {item.plate || "—"}</div>
          <div className="info"><span>سنة الشراء</span>{item.purchaseYear || "—"}{age !== null ? ` (${age} سنة)` : ""}</div>
        </div>

        <h4 style={{ margin:"6px 0" }}>نظرة سريعة</h4>
        <div style={{ marginBottom:8 }}>
          <span className="stat"><b>{wos.length}</b>أوامر العمل</span>
          <span className="stat"><b style={{ color: openCount ? "var(--err)" : "var(--ok)" }}>{openCount}</b>مفتوحة</span>
          <span className="stat"><b>{fs.f90}</b>أعطال 90 يوم</span>
          <span className="stat"><b>{fs.mtbf !== null ? fs.mtbf.toFixed(0) : "—"}</b>MTBF (يوم)</span>
          <span className="stat">
            <b>{hasData ? <span className={`badge ${risk.level}`}>{LEVEL_LABEL[risk.level]}</span> : "—"}</b>مستوى الخطر
          </span>
        </div>
        <div className="grid2" style={{ gap:8 }}>
          <div className="info"><span>آخر أمر عمل</span>{lastWo ? `${fmtDate(lastWo.opened_at)} — ${lastWo.fault_category ? faultText(lastWo.fault_category) + " — " : ""}${lastWo.description || ""}` : "لا يوجد"}</div>
          <div className="info"><span>الصيانة الوقائية</span>{pmCount} خطة</div>
          <div className="info"><span>قطع غيار مرتبطة</span>{parts.length} بند ({partsQty} قطعة)</div>
          <div className="info"><span>ملحقات مرتبطة</span>{accs.length ? accs.map(a => a.name).join("، ") : "لا يوجد"}</div>
          <div className="info" style={{ gridColumn:"1 / -1" }}><span>آخر تحويل</span>{lastTr ? `${lastTr.transfer_date || ""} — من ${siteName(lastTr.from_site_id)} إلى ${siteName(lastTr.to_site_id)}` : "لا يوجد"}</div>
        </div>
        {hasData && <p className="hint" style={{ marginTop:8 }}>التوصية: {risk.recs.join("؛ ")}</p>}
      </div>
    </div>
  );
}

// ---- الصيانة التنبؤية ----
function Predictive({ equipment, workorders, readings, setReadings, canEdit, currentUser, onLog, equipmentOptionPairs, eqText, inScope, canExport, exportColumns }){
  const [sub,setSub] = useState("risk");
  const eqList = equipment.filter(e => e.status !== "سكراب");
  const scopedReadings = readings.filter(inScope);

  const seriesList = buildSeriesList(scopedReadings);

  const rows = eqList.map(e => {
    const fs = failureStats(e.equipment_id, workorders);
    const ser = seriesList.filter(s => s.eid === e.equipment_id);
    const risk = riskScore(fs, ser, e);
    const hasData = fs.count > 0 || ser.length > 0;
    return { e, fs, ser, risk, hasData };
  }).sort((a,b) => b.risk.score - a.risk.score);

  const highCount = rows.filter(r => r.risk.level === "high").length;
  const alertCount = seriesList.filter(s => s.level > 0).length;
  const soonCount = rows.filter(r => (r.fs.nextExpected && (r.fs.nextExpected.getTime() - Date.now())/86400000 <= 30) || r.ser.some(s => s.daysFromNow !== null && s.daysFromNow <= 30)).length;
  const noData = rows.filter(r => !r.hasData).length;

  const levelBadge = (lvl) => lvl === 2 ? <span className="badge high">خطر</span> : lvl === 1 ? <span className="badge mid">تحذير</span> : <span className="badge low">طبيعي</span>;

  return (
    <div>
      <div className="tabs">
        <button className={`tab ${sub==="risk"?"active":""}`} onClick={()=>setSub("risk")}>تقييم المخاطر</button>
        <button className={`tab ${sub==="trend"?"active":""}`} onClick={()=>setSub("trend")}>اتجاه القراءات والتنبؤ</button>
        <button className={`tab ${sub==="readings"?"active":""}`} onClick={()=>setSub("readings")}>قراءات الحالة (إدخال)</button>
      </div>

      {sub === "risk" && (
        <div>
          <div className="card">
            <h3>الصيانة التنبؤية — ملخص</h3>
            <div>
              <span className="stat"><b style={{ color:"var(--err)" }}>{highCount}</b>معدات عالية الخطر</span>
              <span className="stat"><b>{alertCount}</b>قراءات في التحذير/الخطر</span>
              <span className="stat"><b>{soonCount}</b>عطل متوقع خلال 30 يومًا</span>
              <span className="stat"><b style={{ color:"var(--muted)" }}>{noData}</b>معدات بلا بيانات كافية</span>
            </div>
            <p className="hint" style={{ marginTop:8 }}>
              يعتمد التقييم على سجل الأعطال (أوامر العمل غير الوقائية): عدد الأعطال خلال 90 يومًا، متوسط الفترة بين الأعطال MTBF (بالأيام التقويمية)،
              متوسط زمن الإصلاح MTTR (بالساعات)، وعلى قراءات الحالة واتجاهها وعمر المعدة. تزداد الدقة كلما زادت البيانات المسجلة.
            </p>
          </div>

          <div className="card">
            <h3>ترتيب المعدات حسب درجة الخطر</h3>
            <div style={{ overflowX:"auto" }}>
              <table>
                <thead><tr>
                  <th>المعدة</th><th>الخطر</th><th>أعطال 90 يوم</th><th>MTBF (يوم)</th><th>MTTR (ساعة)</th>
                  <th>آخر عطل</th><th>العطل المتوقع</th><th>أسباب التقييم</th><th>التوصية</th>
                </tr></thead>
                <tbody>
                  {rows.map(({ e, fs, risk, hasData }) => (
                    <tr key={e.equipment_id}>
                      <td>{eqText(e.equipment_id)}{e.desc ? <div className="hint">{e.desc}</div> : null}</td>
                      <td>{hasData ? <span className={`badge ${risk.level}`}>{LEVEL_LABEL[risk.level]} ({risk.score})</span> : <span style={{ color:"var(--muted)" }}>لا بيانات</span>}</td>
                      <td>{fs.f90}</td>
                      <td>{fs.mtbf !== null ? fs.mtbf.toFixed(0) : "—"}</td>
                      <td>{fs.mttr !== null ? fs.mttr.toFixed(1) : "—"}</td>
                      <td>{fs.lastDate ? fmtDate(fs.lastDate) : "—"}</td>
                      <td>{fs.nextExpected ? fmtDate(fs.nextExpected) : "—"}</td>
                      <td style={{ fontSize:12 }}>{risk.reasons.length ? risk.reasons.join("، ") : "—"}</td>
                      <td style={{ fontSize:12 }}>{hasData ? risk.recs.join("؛ ") : "سجّل أوامر عمل وقراءات حالة لبدء التحليل"}</td>
                    </tr>
                  ))}
                  {rows.length === 0 && <tr><td colSpan="9" style={{ textAlign:"center", color:"var(--muted)" }}>لا توجد معدات</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {sub === "trend" && (
        <div className="card">
          <h3>اتجاه القراءات والتنبؤ ببلوغ الحدود</h3>
          <p className="hint" style={{ marginBottom:8 }}>التنبؤ بالانحدار الخطي لآخر 10 قراءات (يتطلب 3 قراءات على الأقل مع تحديد حد الخطر أو التحذير).</p>
          <div style={{ overflowX:"auto" }}>
            <table>
              <thead><tr>
                <th>المعدة</th><th>المؤشر</th><th>آخر قيمة</th><th>تاريخها</th><th>حد التحذير</th><th>حد الخطر</th><th>الحالة</th><th>الاتجاه (لكل 30 يوم)</th><th>بلوغ الحد المتوقع</th>
              </tr></thead>
              <tbody>
                {[...seriesList].sort((a,b) => (b.level - a.level) || ((a.daysFromNow ?? 1e9) - (b.daysFromNow ?? 1e9))).map(s => (
                  <tr key={s.eid + s.param}>
                    <td>{eqText(s.eid)}</td>
                    <td>{s.param}</td>
                    <td>{s.last}</td>
                    <td>{fmtDate(s.lastDate)}</td>
                    <td>{s.warn !== null ? s.warn : "—"}</td>
                    <td>{s.crit !== null ? s.crit : "—"}</td>
                    <td>{levelBadge(s.level)}</td>
                    <td>{s.slope === null ? "—" : (s.slope*30 > 0 ? "▲ " : s.slope*30 < 0 ? "▼ " : "● ") + Math.abs(s.slope*30).toFixed(2)}</td>
                    <td>{s.predicted ? `${fmtDate(s.predicted)} (بعد ${Math.round(s.daysFromNow)} يوم)` : "—"}</td>
                  </tr>
                ))}
                {seriesList.length === 0 && <tr><td colSpan="9" style={{ textAlign:"center", color:"var(--muted)" }}>لا توجد قراءات — أضفها من تبويب "قراءات الحالة"</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {sub === "readings" && (
        <SectionTable title="قراءات الحالة" storageKey="readings" idField="reading_id" idPrefix="RD"
          data={readings} setData={setReadings} viewFilter={inScope} canEdit={canEdit} currentUser={currentUser} onLog={onLog}
          canExport={canExport} exportColumns={exportColumns} dateField="date"
          defaultsOnAdd={() => ({ date: todayStr(), direction:"high" })}
          validate={(m) => {
            if(!m.equipment_id) return "اختر المعدة";
            if(!m.parameter || !String(m.parameter).trim()) return "اختر أو اكتب المؤشر";
            if(numOrNull(m.value) === null) return "أدخل قيمة القراءة";
            if(!m.date) return "أدخل التاريخ";
            return "";
          }}
          columns={[
            { key:"date", label:"التاريخ" },
            { key:"equipment_id", label:"المعدة", render:r=>eqText(r.equipment_id), text:r=>eqText(r.equipment_id) },
            { key:"parameter", label:"المؤشر" },
            { key:"value", label:"القيمة" },
            { key:"warn_limit", label:"حد التحذير" },
            { key:"crit_limit", label:"حد الخطر" },
            { key:"direction", label:"اتجاه الخطر", render:r=> r.direction === "low" ? "انخفاض" : "ارتفاع", text:r=> r.direction === "low" ? "انخفاض" : "ارتفاع" },
          ]}
          fieldsDef={[
            { key:"equipment_id", label:"المعدة", type:"search", optionPairs:equipmentOptionPairs, fallbackLabel:eqText },
            { key:"date", label:"تاريخ القراءة", type:"date" },
            { key:"parameter", label:"المؤشر", type:"combo", options:Array.from(new Set([...READING_PARAMS, ...distinctValues(readings,"parameter")])) },
            { key:"value", label:"القيمة", type:"number" },
            { key:"warn_limit", label:"حد التحذير (اختياري)", type:"number" },
            { key:"crit_limit", label:"حد الخطر (اختياري)", type:"number" },
            { key:"direction", label:"اتجاه الخطر", type:"select", optionPairs:DIR_PAIRS },
            { key:"notes", label:"ملاحظات" },
          ]}
        />
      )}
    </div>
  );
}

function Reports({ equipment, workorders, pmplans, purchaserequests, transfers, users, spareparts, accessories, readings, invoices, sites, canExportPrint, isManager, exportSets, invoiceRows }){

    const payload = { equipment, workorders, pmplans, purchaserequests, transfers, users, spareparts, accessories, readings, invoices, sites };
    const json = JSON.stringify(payload);
    navigator.clipboard.writeText(json).then(()=> setCopied("تم نسخ نسخة كاملة من البيانات ✓")).catch(()=> setCopied("تعذر النسخ التلقائي"));

  const SECTIONS = [
    { title:"المعدات", data:equipment, columns:exportSets.equipment },

    { title:"قطع الغيار", data:spareparts, columns:exportSets.parts },
    { title:"الفواتير", data:invoiceRows, columns:exportSets.invoices },

          {copied && <p className="ok-msg">{copied}</p>}
          <p style={{ color:"var(--muted)", fontSize:13 }}>احتفظ بهذه النسخة أسبوعيًا كخط رجعة إضافي.</p>
        </div>
      )}

      {canExportPrint && (
        <div className="card">

          <p style={{ color:"var(--muted)", fontSize:13, marginBottom:10 }}>لتصفية حسب تاريخ أو محطة معينة، افتح الصفحة المطلوبة مباشرة — خيارات التصفية والتصدير متاحة في أعلى كل صفحة.</p>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {SECTIONS.map(s => (
              <div key={s.title} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", borderBottom:"1px solid var(--border)", paddingBottom:8 }}>
                <span>{s.title} ({s.data.length})</span>
                <div className="row-actions">
                  <button className="icon-btn" onClick={()=>downloadCSV(`${s.title}.csv`, toCSV(s.columns, s.data))}>تصدير Excel</button>
                  <button className="icon-btn" onClick={()=>printTable(s.title, s.columns, s.data)}>🖨️ طباعة</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
